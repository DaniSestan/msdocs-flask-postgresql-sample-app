# A generic, single database configuration.

[alembic]
# path to migration scripts
; script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

; sqlalchemy.url = sqlite:///app.db

# Logging configuration
[loggers]
; keys = root,sqlalchemy,alembic
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
; keys = console,console_sqlalchemy
keys = console_out, console_err, file_root, file_sqlalchemy, file_alembic, file_flask_migrate

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console_err
qualname =

[logger_sqlalchemy]
level = WARN
handlers = file_sqlalchemy
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = file_alembic
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers = file_flask_migrate
qualname = alembic

[handler_console_out]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[handler_console_err]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file_root]
class = FileHandler
args=("%(root)s", "a",)
level = NOTSET
formatter = generic

[handler_file_sqlalchemy]
class = FileHandler
args=('%(sqlalchemy)s','a',)
level = NOTSET
formatter = generic

[handler_file_alembic]
class = FileHandler
args=('%(alembic)s','a',)
level = NOTSET
formatter = generic

[handler_file_flask_migrate]
class = FileHandler
args=('%(flask_migrate)s','a',)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S