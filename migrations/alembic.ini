# A generic, single database configuration.

[alembic]
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false
# set logs to write to a file in Azure cloud when the app is deployed in production/through cloud resources; look into azure storage settings, specifically file retention; 1-3 months

# Logging configuration
[loggers]
; keys = root,sqlalchemy,alembic,flask_migrate
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
; keys = console,file
keys = console_out,console_err,root_out,sqlalchemy_out,alembic_out,flask_migrate_out,root_err,sqlalchemy_err,alembic_err,flask_migrate_err

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console_err
qualname =

[logger_sqlalchemy]
level = WARNING
handlers = handler_file_sqlalchemy_err
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console_out]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[handler_console_err]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# leave levels as not set unless something needs to be customized; loggers have a level key that the level defaults to
[handler_file_root_out]
class = FileHandler
args = (root_out.log)
level = NOTSET
formatter = generic

[handler_file_root_err]
class = FileHandler
args = (root_err.log)
level = NOTSET
formatter = generic

[handler_file_sqlalchemy_out]
class = FileHandler
args = (sqlalchemy_out.log)
level = NOTSET
formatter = generic

[handler_file_sqlalchemy_err]
class = FileHandler
args = (sqlalchemy_err.log)
level = NOTSET
formatter = generic

[handler_file_alembic_out]
class = FileHandler
args = (alembic_out.log)
level = NOTSET
formatter = generic

[handler_file_alembic_err]
class = FileHandler
args = (alembic_err.log)
level = NOTSET
formatter = generic

[handler_file_flask_migrate_out]
class = FileHandler
args = (flask_migrate_out.log)
level = NOTSET
formatter = generic

[handler_file_flask_migrate_err]
class = FileHandler
args = (flask_migrate_err.log)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
